<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Test Website</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>My Test Website</h1>
    <nav>
      <a href="#home" class="nav-link">Home</a>
      <a href="#about" class="nav-link">About</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>
  </header>

  <main class="container" id="home">
    <section class="card">
      <h2>Welcome</h2>
      <p>This is a simple static website for testing HTML, CSS, and JavaScript.</p>
      <button id="greetBtn">Click me</button>
    </section>

    <section class="card" id="about">
      <h2>About</h2>
      <p>Built as a minimal example with responsive layout and interactive JS.</p>
    </section>

    <section class="card" id="contact">
      <h2>Contact</h2>
      <form id="contactForm">
        <label>
          Name
          <input type="text" id="name" required />
        </label>
        <label>
          Message
          <textarea id="message" required></textarea>
        </label>
        <button type="submit">Send</button>
        <p id="formStatus" class="muted"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> My Test Website</p>
  </footer>

  <script src="https://unpkg.com/@amplitude/unified@1.1.9/lib/scripts/amplitude-min.umd.js"></script>
  <script>
    amplitude.initAll('6955d0420972e08bf69c717891914262', {
      serverZone: 'EU',
      analytics: { autocapture: true },
      sessionReplay: { sampleRate: 1 },
    }).then(function() {
      console.log('Amplitude initialized');
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
